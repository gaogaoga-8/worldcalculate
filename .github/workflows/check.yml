name: Experience checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run check:experience
      - run: npm run check:render
      - run: npm run check:cosmos
      - run: npm run check:reset
      - run: npm run check:community
